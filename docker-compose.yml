services:
  postgres:
    image: postgres:16-alpine
    container_name: porjar-db
    restart: always
    environment:
      POSTGRES_USER: porjar
      POSTGRES_PASSWORD: porjar_dev
      POSTGRES_DB: porjar
    ports:
      - "5499:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porjar"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - porjar-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: porjar-redis
    restart: always
    ports:
      - "6399:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --appendonly yes
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 60
        --timeout 300
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - porjar-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1536M

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: porjar-centrifugo
    restart: always
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo --config=config.json
    env_file: ./.env.centrifugo
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - porjar-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api:
    build:
      context: ./porjar-api
      dockerfile: Dockerfile
    container_name: porjar-api
    restart: always
    env_file: ./porjar-api/.env
    ports:
      - "9090:8080"
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - porjar-net
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4G

  web:
    build:
      context: ./porjar-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://esidenpasar.com/api/v1
        NEXT_PUBLIC_WS_URL: wss://esidenpasar.com/ws/connection/websocket
    container_name: porjar-web
    restart: always
    env_file: ./porjar-web/.env
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4200"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - porjar-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  porjar-net:
    driver: bridge
